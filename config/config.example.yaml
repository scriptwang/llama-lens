# llama灵境 配置文件模板（唯一配置文件）
# 用法：cp config/config.example.yaml config/config.yaml 后按需修改。
# 主机管理在界面【主机管理】中维护（存 data/llama_ctl.db），本文件不放主机。
# 每项均可用同名环境变量覆盖（环境变量 > 本文件 > 默认值），变量名见注释。
# config/config.yaml 与 .env 均含敏感信息，已被 .gitignore 排除，勿提交。

server:
  port: 8000                 # 面板端口（env PORT）
  host: 0.0.0.0            # 监听地址（env LLAMACTL_HOST，面板固定 0.0.0.0）
  data_dir: data             # 数据目录：主机库 + 监控历史 + 密钥（env LLAMACTL_DATA_DIR）
  db_path: data/llama_ctl.db   # 主机库路径（env LLAMACTL_DB_PATH）
  auth_enabled: true         # 登录鉴权开关（env LLAMACTL_AUTH_ENABLED，不建议关闭）
  admin_user: root          # 管理员用户名（env LLAMACTL_ADMIN_USER）
  admin_password: 123456      # 初始管理员密码，仅首次启动（users 表为空）生效（env LLAMACTL_ADMIN_PASSWORD）
  ssh_timeout: 10            # SSH 命令超时秒数（env LLAMACTL_SSH_TIMEOUT）
  # jwt_secret: ""           # JWT 签名密钥；留空则用 data/jwt.secret 自动生成（env LLAMACTL_JWT_SECRET）
  # fernet_key: ""           # 凭证加密密钥；留空则用 data/fernet.key 自动生成（env LLAMACTL_FERNET_KEY）

global:
  push_interval: 1.0          # WS 推送间隔（秒）
  history:
    llama_points: 3600        # llama 序列环形缓冲点数（@1s，3600 = 1h）
    host_points: 1800         # host 序列环形缓冲点数（@2s，1800 = 1h）
    enabled: true           # 历史持久化开关（默认 true）
    db_path: data/history.db  # 监控历史库路径，相对项目根目录（无 env 覆盖）
    raw_retention_days: 7   # 原始数据保留天数
    agg_retention_days: 90  # 1 分钟聚合数据保留天数
    events_retention_days: 30
  electricity_price: 0.5    # 电价（元/kWh，0 = 不显示电费；效率统计用）
  thresholds:               # 全局阈值覆盖（可选，默认见 backend/config.py）
    gpu_util: {warn: 80, danger: 95}
    ctx: {warn: 80, danger: 90}
    queue: {warn: 8, danger: 16}   # SGLang 排队请求数（waiting），仅 sglang 主机生效
ui:
  tabs:                        # 顶部 TAB 页显隐（功能开关，false = 隐藏）
    monitor: true              # 监控
    service: true              # 服务
    terminal: true             # 终端
    model: true                # 模型
    playground: true           # 试玩
    gateway: true              # 网关（主机详情里的网关 Tab）

gateway:
  enabled: true
  default_host: ai.lan
  strategy:
    affinity: true                # 档1 模型亲和（默认开）
    same_model_lb: false          # 档2 同模型 LB（默认关）
    cross_model_fallback: false   # 档3 跨模型降级（默认关）
  model_prices: {}                # token 单价口径（可选）{model: price_per_1k}
  audit_retention_days: 30
  trace_retention_days: 7
  db_path: data/gateway.db
