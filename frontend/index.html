<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>LLMLens · LLM 推理服务实时监控</title>
  <script>
    // 首帧前应用持久化主题，避免主题闪烁（FOUC）
    (function () {
      try {
        var t = localStorage.getItem('llamalens.theme')
      var ok = ['aurora', 'terminal', 'light', 'monokai', 'nord', 'dracula', 'synthwave', 'tokyonight', 'matrix']
      if (ok.indexOf(t) !== -1) {
        document.documentElement.setAttribute('data-theme', t)
        // 同步 dark 类（Element Plus 暗色变量 / 管理区样式依赖），与 theme/index.js 保持一致
        document.documentElement.classList.toggle('dark', t !== 'light')
      }
      } catch (e) {}
    })()
  </script>
  <style>html { background: #0a0e17; } html[data-theme='terminal'] { background: #0e0e10; } html[data-theme='light'] { background: #f6f8fa; } html[data-theme='monokai'] { background: #272822; } html[data-theme='nord'] { background: #2e3440; } html[data-theme='dracula'] { background: #282a36; } html[data-theme='synthwave'] { background: #262335; } html[data-theme='tokyonight'] { background: #1a1b26; } html[data-theme='matrix'] { background: #050805; }</style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
